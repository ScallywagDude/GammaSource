// Run only in an isolated test profile while aiming at an ordinary wall.
// Local effect probes do not damage entities or modify saved user bindings.
sv_cheats 1
developer 1
gamma_impact_debug 1
gamma_blood_debug 1
echo GAMMA_IMPACT_CHECK_BEGIN
gamma_impact_info
gamma_blood_info
r_printdecalinfo
gamma_delay 0.2 gamma_impact_probe impact
gamma_delay 0.35 jpeg gamma_impact_wall 95
gamma_delay 0.8 gamma_impact_probe blood
gamma_delay 0.9 jpeg gamma_impact_red 95
gamma_delay 1.5 gamma_impact_probe yellow
gamma_delay 1.6 jpeg gamma_impact_yellow 95
gamma_delay 2.2 gamma_impact_probe spray
gamma_delay 2.3 jpeg gamma_impact_spray 95
gamma_delay 3.0 gamma_blood_info
gamma_delay 3.1 r_printdecalinfo
gamma_delay 7.8 jpeg gamma_impact_persistent 95
gamma_delay 7.9 r_printdecalinfo
gamma_delay 8.0 echo GAMMA_IMPACT_CHECK_COMPLETE
