echo GAMMA_PHYSGUN_BASELINE_BEGIN
god
notarget
setpos 96 584 40
setang 14 0 0
give weapon_physgun
use weapon_physgun
gamma_delay 0.5 ent_create prop_physics_override targetname gamma_physgun_probe model models/props_junk/wood_crate001a.mdl
gamma_delay 0.6 ent_fire gamma_physgun_probe DisableMotion
gamma_delay 0.7 ent_fire gamma_physgun_probe AddOutput "origin 256 584 64"
gamma_delay 0.8 ent_fire gamma_physgun_probe EnableMotion
gamma_delay 0.85 +attack
gamma_delay 1 gamma_physgun_beaminfo
gamma_delay 1 gamma_actorinfo gamma_physgun_probe
gamma_delay 1.1 screenshot physgun_baseline_initial
gamma_delay 2 setang -15 0 0
gamma_delay 3 gamma_physgun_beaminfo
gamma_delay 3 gamma_actorinfo gamma_physgun_probe
gamma_delay 3.1 screenshot physgun_baseline_lift
gamma_delay 4 -attack
gamma_delay 4.5 gamma_physgun_beaminfo
gamma_delay 4.6 gamma_actorinfo gamma_physgun_probe
gamma_delay 5 ent_fire gamma_physgun_probe Kill
gamma_delay 5.1 echo GAMMA_PHYSGUN_BASELINE_COMPLETE
gamma_delay 6 quit
