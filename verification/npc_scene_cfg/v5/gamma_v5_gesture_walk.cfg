// Controlled scene tests deliberately cancel native scenes; native proof is the separate observer run.
// Goal A/B use original e3_lab info_node 2/8 coordinates on the lab floor.
echo GAMMA_V5_GESTURE_WALK_BEGIN
gamma_playerinfo
ent_fire scene_1_acting_intro Cancel
ent_fire scene_1_sequence2 Cancel
ent_fire scene_1_sequence3 Cancel
ent_create info_target targetname gamma_v5_goal_a
ent_create info_target targetname gamma_v5_goal_b
gamma_delay 0.2 ent_fire gamma_v5_goal_a AddOutput "origin 2626.46 -1889.63 5"
gamma_delay 0.3 ent_fire gamma_v5_goal_b AddOutput "origin 2798 -1885 5"
gamma_delay 0.5 gamma_observe_actor alyx 160
gamma_delay 1 gamma_actorinfo alyx
gamma_delay 1.1 screenshot v5_walk_before
gamma_delay 2 echo GAMMA_V5_WALK_INTERRUPT_ATTEMPT
gamma_delay 2.1 gamma_scene_probe scenes/gamma_phasea/legacy_gesture_walk.vcd alyx gamma_v5_goal_a
gamma_delay 2.6 ent_fire gamma_scene_probe_* Cancel
gamma_delay 2.8 gamma_actorinfo alyx
gamma_delay 3.1 echo GAMMA_V5_WALK_RESTART
gamma_delay 3.2 gamma_scene_probe scenes/gamma_phasea/legacy_gesture_walk.vcd alyx gamma_v5_goal_a
gamma_delay 4 screenshot v5_walk_legacy_restart
gamma_delay 5 gamma_actorinfo alyx
gamma_delay 11.5 gamma_actorinfo alyx
gamma_delay 12 echo GAMMA_V5_WALK_REPEAT
gamma_delay 12.1 gamma_scene_probe scenes/gamma_phasea/legacy_gesture_walk.vcd alyx gamma_v5_goal_b
gamma_delay 13 gamma_actorinfo alyx
gamma_delay 13.1 screenshot v5_walk_legacy_repeat
gamma_delay 20.5 gamma_actorinfo alyx
gamma_delay 21 echo GAMMA_V5_POSTURE_CONTROL
gamma_delay 21.1 gamma_scene_probe scenes/gamma_phasea/explicit_posture_walk.vcd alyx gamma_v5_goal_a
gamma_delay 22 gamma_actorinfo alyx
gamma_delay 22.1 screenshot v5_walk_posture
gamma_delay 29.5 gamma_actorinfo alyx
gamma_delay 30 echo GAMMA_V5_POSTURE_REPEAT
gamma_delay 30.1 gamma_scene_probe scenes/gamma_phasea/explicit_posture_walk.vcd alyx gamma_v5_goal_b
gamma_delay 31 gamma_actorinfo alyx
gamma_delay 31.1 screenshot v5_walk_posture_repeat
gamma_delay 38.5 gamma_actorinfo alyx
gamma_delay 39 gamma_playerinfo
gamma_delay 39.1 gamma_observe_off
gamma_delay 39.2 echo GAMMA_V5_GESTURE_WALK_COMPLETE
gamma_delay 40 quit
