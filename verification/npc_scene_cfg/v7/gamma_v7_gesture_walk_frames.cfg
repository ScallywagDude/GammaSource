// Lossless per-rendered-frame capture; original story and test event types unchanged.
host_framerate 60
startmovie gamma_v7_walk tga
hideconsole
exec gamma_v7_gesture_walk.cfg
gamma_legacy_pose_debug 1
gamma_delay 4.5 gamma_pose_snapshot 167 v7_walk_legacy_restart
gamma_delay 13.5 gamma_pose_snapshot 167 v7_walk_legacy_repeat
gamma_delay 22.5 gamma_pose_snapshot 167 v7_walk_posture
gamma_delay 31.5 gamma_pose_snapshot 167 v7_walk_posture_repeat
gamma_delay 39.3 endmovie
gamma_delay 39.5 host_framerate 0
