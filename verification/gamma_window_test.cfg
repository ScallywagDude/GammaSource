unbindall
joystick 0
touch_enable 0
sv_cheats 1
developer 1
fps_max 60
mat_queue_mode 0
engine_no_focus_sleep 0
hideconsole
wait 120
echo UI_WINDOWED_START
gamma_windowinfo
screenshot ui_windowed
vid_borderless 1
mat_setvideomode 1024 640 1
wait 180
echo UI_BORDERLESS
gamma_windowinfo
screenshot ui_borderless
vid_borderless 0
mat_setvideomode 1920 1200 1
wait 180
echo UI_SAME_SIZE_FRAMED
gamma_windowinfo
vid_borderless 1
mat_setvideomode 1920 1200 1
wait 180
echo UI_SAME_SIZE_BORDERLESS
gamma_windowinfo
vid_borderless 0
mat_setvideomode 1024 640 1
wait 180
echo UI_WINDOWED_RESTORED
gamma_windowinfo
screenshot ui_restored
quit
