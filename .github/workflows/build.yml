name: Build

# The upstream jobs targeted windows-2019/ubuntu-20.04 runners, which no longer
# exist, so they sat queued forever. This builds the configuration GammaSource
# ships: Windows x64 release, HL2 game DLLs, engine and Hammer, exactly as
# build_gammasource.cmd does.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-amd64:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4

    # The bundled waf (2018) predates Python 3.12's removal of the imp module.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Configure windows-amd64 release
      run: python waf configure -T release

    - name: Build windows-amd64 release
      run: python waf build -j4 -k

    - name: Upload waf logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: waf-logs-windows-amd64
        path: |
          build/config.log
          build/.lock-waf*
        if-no-files-found: ignore
