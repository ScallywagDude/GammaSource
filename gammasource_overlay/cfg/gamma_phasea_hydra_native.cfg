gamma_delay 7 gamma_actorinfo Alyx
gamma_delay 10 gamma_actorinfo Alyx
gamma_delay 15 gamma_actorinfo Alyx
gamma_delay 20 gamma_actorinfo Alyx
gamma_delay 3.5 screenshot phasea_hydra_at_3p5
gamma_delay 7.5 screenshot phasea_hydra_at_7p5
gamma_delay 14.5 screenshot phasea_hydra_at_14p5
gamma_delay 20.5 screenshot phasea_hydra_at_20p5
